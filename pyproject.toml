[project]
name = "driftline"
version = "0.1.1"
description = "Vision drift detection for software projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "C-X1an" }
]
requires-python = ">=3.10"

dependencies = [
    "openai==3.28.0",
    "rich==15.0.0",
    "typer==0.27.3"
]

[project.urls]
Repository = "https://github.com/C-X1an/driftline"

[project.scripts]
driftline = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "core*"]
namespaces = true

[tool.setuptools.package-data]
"core.ai.prompts" = ["*.txt"]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"
